(function () {
  // 29 content pages pre-rendered from the PDF (the trailing colophon

    out.push('<figure style="margin:0">' +

      (i <= 2 ? ' fetchpriority="high"' : ' loading="lazy"') +
      ' style="width:100%; display:block; border:1px solid var(--line); background:#FFF">' +

      '</figure>');
  }
  document.getElementById('pf-pages').innerHTML = out.join('');
})();
