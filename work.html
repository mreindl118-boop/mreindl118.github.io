<script>
(function () {
  var N = 17, idx = 0, picked = null;
  var $ = function (id) { return document.getElementById(id); };
  // [label, first book page]; pages 2k and 2k+1 sit on spread k, the cover alone on spread 0
  var PAGES = 33;
  var TAGS = [['Cover',1],['Contents',2],['01 Proctor',3],['02 Buttes-Chaumont',12],['03 West End',14],
    ['04 Weaver',16],['05 CRC',20],['06 Lunkenheimer',22],['07 Hyundai',23],['08 Evans',25],
    ['09 Green Roof',28],['Other Work',30],['Colophon',32]];
  function spreadOf(page) { return Math.floor(page / 2); }
  function pagesOf(k) { return k === 0 ? [1, 1] : [2 * k, Math.min(2 * k + 1, PAGES)]; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function src(k) { return 'assets/portfolio/spread-' + String(k).padStart(2, '0') + '.webp'; }
  var pz = US.panZoom($('pf-stage'), $('pf-surface'), $('pf-badge'));
  $('pf-tags').innerHTML = TAGS.map(function (t, i) {
    return '<button class="thumbbtn" data-i="' + i + '">' + t[0] + '</button>';
  }).join('');
  function show(k) {
    idx = Math.min(Math.max(k, 0), N - 1);
    var img = document.createElement('img');
    img.src = src(idx);
    img.alt = 'Portfolio, ' + (idx === 0 ? 'cover' : 'pages ' + (2 * idx) + '\u2013' + (2 * idx + 1));
    img.draggable = false;
    img.style.cssText = 'max-width:100%; max-height:100%; width:auto; height:auto; display:block; background:#FFF; user-select:none; visibility:hidden';
    var sf = $('pf-surface');
    sf.innerHTML = '<span style="position:absolute; font-family:var(--mono); font-size:12px; color:var(--faint)">Loading spread\u2026</span>';
    sf.appendChild(img);
    var want = idx;
    img.onload = function () {
      if (want !== idx) return;
      if (sf.firstChild && sf.firstChild.tagName === 'SPAN') sf.firstChild.remove();
      img.style.visibility = 'visible';
      pz.fit();
    };
    pz.fit();
    var pp = pagesOf(idx);
    $('pf-num').textContent = pp[0] === pp[1] ? 'P. ' + pad(pp[0]) : 'PP. ' + pad(pp[0]) + '\u2013' + pad(pp[1]);
    Array.prototype.forEach.call($('pf-tags').children, function (b, i) {
      var first = TAGS[i][1], last = i + 1 < TAGS.length ? TAGS[i + 1][1] - 1 : PAGES;
      var onScreen = first <= pp[1] && last >= pp[0];
      b.classList.toggle('active', picked === null ? onScreen : i === picked);
    });
    picked = null;
    [idx + 1, idx - 1].forEach(function (n) { if (n >= 0 && n < N) { var p = new Image(); p.src = src(n); } });
  }
  $('pf-tags').addEventListener('click', function (e) {
    var b = e.target.closest('.thumbbtn');
    if (!b) return;
    picked = parseInt(b.getAttribute('data-i'), 10);
    show(spreadOf(TAGS[picked][1]));
  });
  $('pf-prev').onclick = function () { show(idx - 1); };
  $('pf-next').onclick = function () { show(idx + 1); };
  $('pf-zin').onclick = pz.zoomIn; $('pf-zout').onclick = pz.zoomOut; $('pf-fit').onclick = pz.fit;
  show(0);
})();
</script>
<script>
(function () {
  var all = [], active = 'All';

  function render() {
    // Projects flagged "hidden" in their content JSON are unlisted here
    // (their direct project.html URLs still work). The filter chips come
    // back automatically once two or more projects are visible.
    var visible = all.filter(function (p) { return !p.hidden; });
    var chips = document.getElementById('chips');
    if (visible.length >= 2) {
      var types = [];
      visible.forEach(function (p) { if (types.indexOf(p.type) < 0) types.push(p.type); });
      chips.innerHTML = ['All'].concat(types).map(function (t) {
        return '<button class="chip' + (t === active ? ' active' : '') + '" data-type="' + US.esc(t) + '">' + US.esc(t) + '</button>';
      }).join('');
      chips.hidden = false;
    } else {
      chips.hidden = true;
    }
    var filtered = active === 'All' ? visible : visible.filter(function (p) { return p.type === active; });
    document.getElementById('grid').innerHTML = filtered.map(function (p) { return US.projectCard(p, true); }).join('');
    document.getElementById('count').textContent = visible.length === 1
      ? '1 project.'
      : visible.length + ' projects, newest first.';
  }

  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    active = b.getAttribute('data-type');
    render();
  });

  US.loadProjects().then(function (projects) {
    all = projects;
    render();
  }).catch(function (e) { console.warn('projects failed', e); });
})();
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var order = [], bySlug = {}, cur = -1;
  var esc = US.esc, clean = US.clean;

  function bodyHtml(p) {
    var meta = [clean(p.type), clean(p.location), US.yearOf(p)].filter(Boolean).join(' &middot; ');
    var h = '<div style="font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--pine)">' + meta + '</div>';
    var blurb = clean(p.summary);
    if (blurb) h += '<p style="font-size:16px; line-height:1.65; max-width:64ch; margin:12px 0 0; text-wrap:pretty">' + esc(blurb) + '</p>';
    if (p.focus && p.focus.length) {
      h += '<div class="rule-label" style="border-top:1px solid var(--ink); padding-top:10px; margin-top:22px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)">Why it matters</div>';
      h += '<ul style="margin:10px 0 0; padding-left:18px; max-width:64ch">' + p.focus.map(function (f) {
        return '<li style="font-size:14.5px; line-height:1.6; margin-top:6px">' + esc(clean(f)) + '</li>';
      }).join('') + '</ul>';
    }
    if (p.slug === 'proctor-landing-park') {
      h += '<div style="margin-top:18px"><a class="link-mono" href="project.html?slug=proctor-landing-park">Full capstone page + 45-page booklet &rarr;</a></div>';
    }
    var gal = p.gallery && p.gallery.length ? p.gallery : (p.images || []);
    h += '<div style="display:flex; flex-direction:column; gap:26px; margin-top:28px">' + gal.map(function (g) {
      return '<figure style="margin:0"><img src="content/projects/' + esc(g.file) + '" alt="' + esc(clean(g.caption)) + '" loading="lazy" style="width:100%; display:block; border:1px solid var(--line); background:#FFF">' +
        '<figcaption style="font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:7px">' + esc(clean(g.caption)) + '</figcaption></figure>';
    }).join('') + '</div>';
    return h;
  }

  function open(slug, push) {
    var i = order.indexOf(slug);
    if (i < 0) return;
    cur = i;
    var p = bySlug[slug];
    $('bo-title').textContent = p.title;
    $('bo-body').innerHTML = bodyHtml(p);
    $('bo-body').scrollTop = 0;
    $('bo-box').hidden = false;
    document.body.style.overflow = 'hidden';
    if (push !== false) { try { history.replaceState(null, '', '#' + slug); } catch (e) {} }
  }
  function close() {
    $('bo-box').hidden = true;
    document.body.style.overflow = '';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  function step(d) { if (cur >= 0) open(order[(cur + d + order.length) % order.length]); }

  $('bo-close').onclick = close;
  $('bo-prev').onclick = function () { step(-1); };
  $('bo-next').onclick = function () { step(1); };
  $('bo-box').addEventListener('click', function (e) { if (e.target === $('bo-box')) close(); });
  document.addEventListener('keydown', function (e) {
    if ($('bo-box').hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  // cards open the blowout instead of navigating (new-tab clicks still work)
  $('grid').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    var a = e.target.closest('a.card');
    if (!a) return;
    var m = /slug=([^&]+)/.exec(a.getAttribute('href') || '');
    if (!m) return;
    e.preventDefault();
    open(decodeURIComponent(m[1]));
  });
  US.loadProjects().then(function (projects) {
    var visible = projects.filter(function (p) { return !p.hidden; });
    order = visible.map(function (p) { return p.slug; });
    visible.forEach(function (p) { bySlug[p.slug] = p; });
    var want = location.hash.replace('#', '');
    if (want && bySlug[want]) open(want, false);
  });
})();
</script>
