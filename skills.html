<script src="assets/js/site.js"></script>
<script>
(function () {
  var LABELS = {
    drafting: 'Drafting + Production',
    modeling: 'Modeling',
    fabrication: 'Fabrication + Models',
    visualization: 'Visualization',
    analysis: 'Analysis + Estimating'
  };
  US.loadSite().then(function (site) {
    var skills = site.skills || {};
    document.getElementById('skills').innerHTML = Object.keys(skills).map(function (cat) {
      var rows = skills[cat].map(function (s) {
        var parts = US.clean(s.level).split('—');
        var grade = parts[0].trim();
        var detail = (parts[1] || '').trim();
        return '<div style="border-bottom:1px solid var(--line-soft); padding:10px 0">' +
          '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px">' +
          '<span class="skill-tool">' + US.esc(s.tool) + '</span>' +
          '<span style="font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:' + (grade.toLowerCase() === 'fluent' ? 'var(--pine)' : 'var(--faint)') + '; flex-shrink:0">' + US.esc(grade) + '</span></div>' +
          (detail ? '<div class="skill-level" style="margin-top:3px">' + US.esc(detail) + '</div>' : '') +
          '</div>';
      }).join('');
      return '<div class="rule-section"><div class="rule-label">' + US.esc(LABELS[cat] || cat) + '</div>' + rows + '</div>';
    }).join('');
  }).catch(function (e) { console.warn('skills failed', e); });
})();
</script>
</body>
