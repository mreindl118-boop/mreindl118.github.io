name: planlab-android

# Builds Matt's planLAB Android app (planlab-android/). Pull requests get tests and a debug build. A merge to main
# makes a signed release, and the newest APK is always at
#   https://github.com/mreindl118-boop/mreindl118.github.io/releases/latest/download/planlab.apk
#
# The signing key is made once and never again (a new key would stop updates installing over the old app):
#   - keystore creates it on its first run on main, keeps it in a main-branch Actions cache (the weekly run keeps the
#     cache alive), and uploads it encrypted to Matt's RSA public key (planlab-android/keys/export_public.pem, the same
#     key Habit-Builder and costLAB use) so he can archive it or promote it to the PLANLAB_KEYSTORE_* secrets.
#   - release signs with the secrets if set, else the cached key, and never mints a new one.

on:
  push:
    branches: [main]
    paths: ['planlab-android/**', 'planlab/data/**', '.github/workflows/planlab-android.yml']
  pull_request:
    paths: ['planlab-android/**', 'planlab/data/**', '.github/workflows/planlab-android.yml']
  workflow_dispatch: {}
  schedule:
    - cron: '41 9 * * 1'

permissions:
  contents: read

concurrency:
  group: planlab-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: planlab-android

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Food lookup tests (the web page's copy; FoodTest.kt checks the same cases)
        run: node --test ../planlab/test/food.test.cjs
      - name: Unit tests and a debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: planlab-debug
          path: planlab-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  keystore:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEYSTORE_B64: ${{ secrets.PLANLAB_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore signing-key cache
        id: restore
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache/restore@v4
        with: { path: ~/keys, key: planlab-release-keystore-v1 }
      - name: Generate signing key (first run only)
        id: gen
        if: env.KEYSTORE_B64 == '' && steps.restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/keys
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -keystore ~/keys/release.keystore -alias planlab -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=planLAB Release, O=mattlabs"
          printf '%s' "$PASS" > ~/keys/storepass.txt
          printf '%s' "$PASS" > ~/keys/keypass.txt
          printf 'planlab' > ~/keys/alias.txt
      - name: Export signing key (encrypted to Matt's public key)
        if: steps.gen.outcome == 'success'
        run: |
          set -euo pipefail
          cd ~/keys
          tar czf ks.tgz release.keystore storepass.txt keypass.txt alias.txt
          openssl rand -hex 32 > aes.hex
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass file:aes.hex -in ks.tgz -out ks.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/planlab-android/keys/export_public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in aes.hex -out aes.hex.enc
          rm -f aes.hex ks.tgz
          mkdir -p /tmp/ksexport && mv ks.tgz.enc aes.hex.enc /tmp/ksexport/
      - name: Upload encrypted key export
        if: steps.gen.outcome == 'success'
        uses: actions/upload-artifact@v4
        with: { name: planlab-keystore-export-encrypted, path: /tmp/ksexport/, retention-days: 30 }
      - name: Save signing-key cache
        if: steps.gen.outcome == 'success'
        uses: actions/cache/save@v4
        with: { path: ~/keys, key: planlab-release-keystore-v1 }

  release:
    needs: [keystore]
    if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'pull_request' && needs.keystore.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.PLANLAB_KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.PLANLAB_KEYSTORE_PASS }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key from cache
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache/restore@v4
        with: { path: ~/keys, key: planlab-release-keystore-v1 }
      - name: Materialize signing key
        run: |
          set -euo pipefail
          mkdir -p ~/keys
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/keys/release.keystore
            printf '%s' "$KEYSTORE_PASS" > ~/keys/storepass.txt; printf '%s' "$KEYSTORE_PASS" > ~/keys/keypass.txt; printf 'planlab' > ~/keys/alias.txt
          elif [ ! -f ~/keys/release.keystore ]; then
            echo "::error::No signing key in the cache or secrets. A release never mints a new key."; exit 1
          fi
          {
            echo "storeFile=$HOME/keys/release.keystore"
            echo "storePassword=$(cat ~/keys/storepass.txt)"
            echo "keyAlias=$(cat ~/keys/alias.txt)"
            echo "keyPassword=$(cat ~/keys/keypass.txt)"
          } > keystore.properties
      - name: Test and build the signed APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Check the signature
        run: |
          set -euo pipefail
          rm -f keystore.properties
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=planLAB Release" || { echo "::error::not signed with the release key"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk planlab.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "planlab-v$VERSION_NAME" planlab.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "planLAB $VERSION_NAME" --notes "planLAB for Android. Install: open planlab.apk on the phone. Newest is always at releases/latest/download/planlab.apk." --latest
