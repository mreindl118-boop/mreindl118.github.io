<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="planLAB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>planLAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky day header, content cards, bottom tab bar. Checkbox rows are the main object. */
:root {
  --bg: #eef1ec;        /* sage paper */
  --surface: #ffffff;
  --ink: #19221d;
  --muted: #5d6a62;
  --line: #d6ddd6;
  --accent: #2b55c7;    /* ink blue: buttons, links, today */
  --accent-ink: #ffffff;
  --done: #2f7d4f;
  --done-soft: #e3f1e7;
  --warm: #b4541b;      /* surgery countdown, due-today */
  --warm-soft: #fbeadf;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121814; --surface: #1b231e; --ink: #e8eee9; --muted: #9aa8a0; --line: #2c3730;
  --accent: #8aa8ff; --accent-ink: #0d1430; --done: #6fcf97; --done-soft: #1d3326;
  --warm: #f0a070; --warm-soft: #3a2619; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1b231e; --ink: #e8eee9; --muted: #9aa8a0; --line: #2c3730;
  --accent: #8aa8ff; --accent-ink: #0d1430; --done: #6fcf97; --done-soft: #1d3326;
  --warm: #f0a070; --warm-soft: #3a2619; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 17px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 700; line-height: 1.1; }
h2 { font-size: 13px; font-family: var(--body); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h3 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; gap: 10px; }
.top .t { flex: 1; min-width: 0; }
.top .sub { color: var(--muted); font-size: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.navbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.navbtn svg { width: 20px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--warm-soft); color: var(--warm); }
.chip.blue { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.chip.green { background: var(--done-soft); color: var(--done); }

.section { display: grid; gap: 8px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }

.check { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; min-height: 60px; }
.box { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center; margin-top: 1px; transition: background .15s, border-color .15s; }
.box svg { width: 18px; height: 18px; opacity: 0; color: var(--accent-ink); }
.check[aria-checked="true"] .box { background: var(--done); border-color: var(--done); }
.check[aria-checked="true"] .box svg { opacity: 1; color: var(--surface); }
.check .txt { min-width: 0; flex: 1; display: grid; gap: 2px; }
.check .label { font-weight: 700; }
.list.plain .check .label { font-weight: 400; }
.list.plain .check { min-height: 52px; padding-block: 11px; }
.check .detail { color: var(--muted); font-size: 15px; }
.check .detail a, .row a { font-weight: 700; text-decoration: none; }
.check[aria-checked="true"] .label { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }

.row { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; }
.row .when { flex: none; width: 74px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; font-weight: 700; }
.row .what { min-width: 0; flex: 1; }
.row .what small { display: block; color: var(--muted); font-size: 14px; }
.row.soon .when { color: var(--warm); }
button.row { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; }
button.row.today { background: color-mix(in srgb, var(--accent) 8%, transparent); }

.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--done); border-radius: 99px; transition: width .25s; }

.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; gap: 16px; align-items: center; }
.hero .big { font-family: var(--display); font-size: 52px; font-weight: 700; line-height: 1; color: var(--warm); font-variant-numeric: tabular-nums; }
.hero p { color: var(--muted); }
.hero strong { color: var(--ink); display: block; font-size: 18px; }

.note { color: var(--muted); font-size: 15px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); }

.capture { display: flex; gap: 8px; }
.capture input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
.btn:disabled { opacity: .5; }

.recipe { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; }
.recipe .name { font-weight: 700; }
.macros { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.macros b { color: var(--ink); }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.sheet .wrap { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.md { display: grid; gap: 10px; }
.md h1 { font-size: 26px; }
.md h2 { margin-top: 8px; }
.md ul, .md ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.md .tbl { overflow-x: auto; }
.md table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { background: none; border: 0; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 58px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.h2row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.btn.small { padding: 8px 14px; }
a.btn { display: inline-block; text-decoration: none; }
.btnrow { display: flex; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; }
.status { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; } [hidden] { display: none !important; }</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" hidden><nav id="tabs"></nav></div>
<div class="sheet" id="sheet" hidden></div>
<script src="app.js"></script>
</body>
</html>
