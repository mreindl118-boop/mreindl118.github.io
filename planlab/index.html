<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1016" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="planLAB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>planLAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: iOS-style single column. Big title + progress ring, a 2x2 grid of tap-to-finish cards,
   grouped lists below, a floating pill tab bar. Tokens are Matt's Eyes base (Simulacrum eyes/taste.json). */
:root {
  --bg: #f2f5f9; --surface: #ffffff; --sunk: #e8edf3; --fg: #0e1620; --muted: #5b6979; --line: #d9e1ea;
  --accent: #1f78d1; --accent-ink: #ffffff; --accent-soft: #e2effc;
  --ok: #17875a; --ok-soft: #dcf2e7; --warn: #a2650f; --warn-soft: #fbefd9;
  --glass: rgb(255 255 255 / .78);
  --shadow: 0 1px 2px rgb(14 22 32 / .06), 0 4px 14px rgb(14 22 32 / .04);
  --raised: 0 8px 28px rgb(14 22 32 / .14);
  --round: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --r-card: 18px; --r-ctl: 12px; --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0b1016; --surface: #141b23; --sunk: #1b242e; --fg: #e8edf3; --muted: #93a2b2; --line: #25303d;
  --accent: #69b4f4; --accent-ink: #06121d; --accent-soft: #15314a;
  --ok: #4cc38a; --ok-soft: #173327; --warn: #e0b25a; --warn-soft: #3a2c12;
  --glass: rgb(20 27 35 / .8);
  --shadow: 0 1px 2px rgb(0 0 0 / .3); --raised: 0 10px 30px rgb(0 0 0 / .5);
  color-scheme: dark } }

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: var(--accent); text-decoration: none; font-weight: 600; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, p { margin: 0; }

.wrap { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(110px + env(safe-area-inset-bottom, 0px)); animation: in .28s var(--ease); }
@keyframes in { from { opacity: .4; transform: translateY(6px); } }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding-top: 8px; }
.hero-t { min-width: 0; display: grid; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
.hero h1 { font: 800 34px/1.05 var(--round); letter-spacing: -.02em; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warm { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.soft { background: var(--sunk); color: var(--muted); }
.btnpill { background: var(--accent); color: var(--accent-ink); }
.hero-ring { position: relative; width: 76px; height: 76px; grid-row: span 1; }
.hero-ring .ring-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 22px var(--round); font-variant-numeric: tabular-nums; }
.hero-ring .ring-n small { font-size: 14px; color: var(--muted); }
.hero-ring .ring-n svg { width: 30px; height: 30px; color: var(--ok); }
.hero-ring.pop { animation: pop .5s var(--ease); }
@keyframes pop { 40% { transform: scale(1.12); } }
.daynav { grid-column: 1 / -1; display: flex; gap: 8px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); flex: none; transition: transform .15s var(--ease); }
.iconbtn:active { transform: scale(.92); }
.iconbtn svg { width: 20px; height: 20px; }
.daynav .iconbtn { width: 40px; height: 36px; border-radius: 999px; }

.ring-bg { fill: none; stroke: var(--sunk); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s var(--ease), stroke .3s; }
.ring-fg.full { stroke: var(--ok); }

.tip, .cheer { font-size: 15px; color: var(--muted); text-align: center; margin-top: -8px; }
.cheer { color: var(--ok); font-weight: 700; }

/* tiles: tap to finish */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; display: grid; gap: 4px; align-content: start; min-height: 128px; padding: 14px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow); overflow: hidden;
  transition: transform .15s var(--ease), background .25s var(--ease), color .25s; }
.tile:active { transform: scale(.96); }
.tile-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tile-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); transition: background .25s, color .25s; }
.tile-ic svg { width: 22px; height: 22px; }
.tile-name { font: 800 19px/1.15 var(--round); }
.tile-sub { font-size: 14px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
.tile[aria-checked="true"] { background: var(--ok); color: #fff; }
.tile[aria-checked="true"] .tile-sub { color: rgb(255 255 255 / .85); }
.tile[aria-checked="true"] .tile-ic { background: rgb(255 255 255 / .2); color: #fff; }
.tile[aria-checked="true"] .box { background: #fff; border-color: #fff; }
.tile[aria-checked="true"] .box svg { color: var(--ok); opacity: 1; transform: scale(1); }
@media (prefers-color-scheme: dark) { .tile[aria-checked="true"] { color: #06120c; } .tile[aria-checked="true"] .tile-sub { color: rgb(6 18 12 / .75); } .tile[aria-checked="true"] .tile-ic { background: rgb(6 18 12 / .15); color: #06120c; } .tile[aria-checked="true"] .box { background: #06120c; border-color: #06120c; } }

.box { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .2s var(--ease), border-color .2s; }
.box svg { width: 16px; height: 16px; opacity: 0; transform: scale(.5); transition: transform .25s var(--ease), opacity .15s; color: var(--accent-ink); }
.check[aria-checked="true"] .box { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"] .box svg { opacity: 1; transform: scale(1); color: var(--surface); }
.check[aria-checked="true"] .rl { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

/* grouped lists */
.sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.lab { font-size: 13px; font-weight: 700; color: var(--muted); padding-left: 4px; display: flex; gap: 8px; align-items: baseline; }
.lab .cnt { font-weight: 600; color: var(--muted); opacity: .8; }
.labrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-inline: 4px; }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); }
.list { overflow: hidden; }
.row { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 12px 16px; position: relative; }
.list > .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
.check { transition: background .15s; }
.check:active { background: var(--sunk); }
.compact .row { min-height: 50px; padding-block: 10px; }
.rt { min-width: 0; flex: 1; display: grid; gap: 1px; }
.rl { font-weight: 600; }
.rl.n { font-weight: 400; }
.rs { font-size: 14px; color: var(--muted); }
.tag { flex: none; width: 76px; font-size: 13px; font-weight: 700; color: var(--muted); }
.tag-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.tag-ic svg { width: 18px; height: 18px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-inline: 4px; }
.dot.warm { background: var(--warn); }
.date { flex: none; width: 46px; height: 46px; border-radius: 12px; background: var(--sunk); display: grid; place-content: center; text-align: center; font: 800 18px/1 var(--round); font-variant-numeric: tabular-nums; }
.date small { display: block; font: 700 10px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.date.soon { background: var(--warn-soft); color: var(--warn); }
.date.soon small { color: var(--warn); }
.bar { height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; margin-inline: 4px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--ok); transition: width .4s var(--ease); }

/* week */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dayp { display: grid; justify-items: center; gap: 4px; padding: 8px 0; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; transition: background .2s; }
.dayp .ring { width: 38px; height: 38px; }
.dayp .ring-bg, .dayp .ring-fg { stroke-width: 5; }
.dayp b { position: absolute; top: 29px; font: 800 14px var(--round); color: var(--fg); }
.dayp > span { line-height: 1; }
.dayp.now > span { color: var(--accent); }
.dayp.sel { background: var(--surface); box-shadow: var(--shadow); }
.focus { font-size: 15px; color: var(--muted); padding-inline: 4px; }
.daycard { display: grid; gap: 10px; padding: 16px; width: 100%; }
.dc-h { display: flex; justify-content: space-between; align-items: center; font: 800 20px var(--round); }
.dc-r { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.dc-r svg { width: 20px; height: 20px; flex: none; color: var(--accent); margin-top: 1px; }
.dc-go { display: flex; align-items: center; gap: 2px; justify-self: end; color: var(--accent); font-weight: 700; font-size: 15px; }
.dc-go svg { width: 16px; height: 16px; }

/* segmented */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--sunk); }
.seg button { padding: 9px 8px; border-radius: 10px; text-align: center; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 4px; transition: background .2s, color .2s; }
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg.two { background: none; padding: 0; gap: 12px; }
.seg.two button { background: var(--surface); box-shadow: var(--shadow); color: var(--accent); min-height: 44px; }

/* coming up */
.count { display: flex; gap: 16px; align-items: center; padding: 18px; }
.count-n { font: 800 56px/1 var(--round); color: var(--warn); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.count-t { display: grid; gap: 2px; }
.count-t b { font: 800 19px var(--round); }
.count-t span { color: var(--muted); font-size: 15px; }
.wish { padding: 14px 16px; display: grid; gap: 8px; }
.wish .lab { padding: 0; }
.field { display: flex; gap: 8px; }
.field input { flex: 1; width: 0; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: var(--r-ctl); border: 0; background: var(--sunk); color: var(--fg); }
.field input:focus { outline: 2px solid var(--accent); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: var(--r-ctl); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; transition: transform .15s var(--ease), opacity .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; }
.btn svg { width: 20px; height: 20px; }
.btn.icon { width: 48px; padding: 0; flex: none; }
.btn.ghost { background: var(--sunk); color: var(--fg); }
.link { color: var(--accent); font-weight: 700; display: inline-flex; vertical-align: middle; }
.link svg { width: 16px; height: 16px; }

/* food */
.recipes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rcard { display: grid; gap: 6px; align-content: start; padding: 14px; min-height: 140px; transition: transform .15s var(--ease); }
.rcard:active { transform: scale(.96); }
.rc-p { display: inline-flex; align-items: baseline; gap: 3px; font-size: 12px; font-weight: 700; color: var(--accent); }
.rc-p b { font: 800 26px/1 var(--round); }
.rc-t { font-weight: 700; line-height: 1.25; }
.rc-m { font-size: 13px; color: var(--muted); }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / 0); transition: background .22s var(--ease); display: flex; align-items: flex-end; justify-content: center; }
.sheet.open { background: rgb(0 0 0 / .35); }
.sheet-card { width: 100%; max-width: 560px; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: var(--raised);
  padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform .26s var(--ease); display: grid; gap: 16px; align-content: start; }
.sheet.open .sheet-card { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; }
.sheet-h { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.sheet-h h1 { font: 800 26px/1.15 var(--round); text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; box-shadow: var(--shadow); }
.stat b { font: 800 20px var(--round); font-variant-numeric: tabular-nums; }
.stat b small { font-size: 12px; color: var(--muted); margin-left: 1px; }
.stat span { font-size: 12px; color: var(--muted); }
.md { display: grid; gap: 10px; line-height: 1.5; }
.md .lab { margin-top: 6px; padding: 0; }
.md ul, .md ol { margin: 0; padding: 14px 16px 14px 34px; display: grid; gap: 8px; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); }
.md p { color: var(--muted); font-size: 15px; }

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 24px; }
.setup-mark { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--raised); }
.setup-mark svg { width: 36px; height: 36px; }
.setup h1 { font: 800 36px var(--round); letter-spacing: -.02em; }
.lead { color: var(--muted); font-size: 17px; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.steps li { display: flex; gap: 14px; padding: 16px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow); opacity: .7; transition: opacity .25s; }
.steps li.on, .steps li.done { opacity: 1; }
.steps li > div { display: grid; gap: 10px; flex: 1; min-width: 0; }
.steps li span { color: var(--muted); font-size: 15px; }
.steps li .btn { justify-self: start; }
.num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 800 15px var(--round); }
.steps li.done .num { background: var(--ok); color: #fff; }
.num svg { width: 16px; height: 16px; }

.empty { display: grid; justify-items: center; gap: 10px; padding: 36px 20px; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); }
.empty svg { width: 34px; height: 34px; color: var(--accent); }
.toast-inline { font-size: 14px; color: var(--warn); text-align: center; }
.foot { font-size: 12px; color: var(--muted); text-align: center; display: flex; justify-content: center; align-items: center; gap: 6px; }

/* floating tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.tabs nav { pointer-events: auto; max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); box-shadow: var(--raised); border: 1px solid var(--line); }
.tabs button { display: grid; justify-items: center; gap: 2px; padding: 7px 2px 6px; border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; transition: background .2s, color .2s; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 350px) { .tiles, .recipes { grid-template-columns: 1fr; } .tag { width: 64px; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" hidden><nav id="tabs" aria-label="Sections"></nav></div>
<div class="sheet" id="sheet" hidden></div>
<script src="app.js"></script>
</body>
</html>
